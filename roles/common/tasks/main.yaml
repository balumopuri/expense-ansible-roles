- name: remove existing directory
  ansible.builtin.file:
    path: "/app"
    state: absent


- name: create app directory
  ansible.builtin.file:
    path: "/app"
    state: directory

- name: download app code
  ansible.builtin.unarchive:
    src: "https://expense-builds.s3.us-east-1.amazonaws.com/expense-{{ COMPONENT }}-v2.zip"
    dest: "{{ APP_LOCATION }}"
    remote_src: yes
